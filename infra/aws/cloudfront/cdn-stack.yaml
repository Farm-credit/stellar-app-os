AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFront CDN with global edge locations for tree photos, map tiles, and static assets (<100ms TTFB)'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]
    Description: Deployment environment

  S3PhotosBucketName:
    Type: String
    Description: S3 bucket name for tree photos

  VercelDomain:
    Type: String
    Description: Vercel deployment domain (e.g., stellar-app-os.vercel.app)

  DomainName:
    Type: String
    Description: Custom domain for CDN (e.g., cdn.farmcredit.com)

  ACMCertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS (must be in us-east-1)

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  # ═══════════════════════════════════════════════════════════════════════════
  # S3 PHOTOS ORIGIN ACCESS CONTROL
  # ═══════════════════════════════════════════════════════════════════════════
  
  PhotosOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'stellar-photos-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFRONT CACHE POLICIES
  # ═══════════════════════════════════════════════════════════════════════════

  # Optimized for photos: aggressive edge caching with query string forwarding for transformations
  PhotosCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'stellar-photos-cache-${Environment}'
        DefaultTTL: 86400  # 1 day
        MaxTTL: 31536000   # 1 year
        MinTTL: 3600       # 1 hour
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - w        # width
              - h        # height
              - q        # quality
              - format   # image format
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept
              - Accept-Encoding
          CookiesConfig:
            CookieBehavior: none

  # Optimized for map tiles: short TTL with stale-while-revalidate
  MapTilesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'stellar-maps-cache-${Environment}'
        DefaultTTL: 300    # 5 minutes
        MaxTTL: 3600       # 1 hour
        MinTTL: 60         # 1 minute
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - region
              - zoom
              - bbox
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  # Optimized for static assets: immutable caching
  StaticAssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'stellar-static-cache-${Environment}'
        DefaultTTL: 31536000  # 1 year
        MaxTTL: 31536000      # 1 year
        MinTTL: 86400         # 1 day
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFRONT ORIGIN REQUEST POLICY
  # ═══════════════════════════════════════════════════════════════════════════

  APIOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub 'stellar-api-origin-${Environment}'
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers
            - Authorization
            - x-api-key
        CookiesConfig:
          CookieBehavior: none

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFRONT RESPONSE HEADERS POLICY
  # ═══════════════════════════════════════════════════════════════════════════

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'stellar-security-headers-${Environment}'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
        CorsConfig:
          AccessControlAllowOrigins:
            Items:
              - '*'
          AccessControlAllowHeaders:
            Items:
              - '*'
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
              - POST
          AccessControlAllowCredentials: false
          OriginOverride: true
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: !If [IsProduction, 'public, max-age=31536000, immutable', 'public, max-age=3600']
              Override: false

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFRONT DISTRIBUTION
  # ═══════════════════════════════════════════════════════════════════════════

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Stellar App CDN - ${Environment}'
        HttpVersion: http2and3
        PriceClass: PriceClass_All  # Global edge locations
        
        Aliases:
          - !Ref DomainName
        
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          # Origin 1: S3 Photos
          - Id: S3PhotosOrigin
            DomainName: !Sub '${S3PhotosBucketName}.s3.${AWS::Region}.amazonaws.com'
            OriginAccessControlId: !Ref PhotosOriginAccessControl
            OriginShield:
              Enabled: true
              OriginShieldRegion: !Ref AWS::Region
            ConnectionAttempts: 3
            ConnectionTimeout: 10

          # Origin 2: Vercel (Next.js app - API routes and pages)
          - Id: VercelOrigin
            DomainName: !Ref VercelDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            OriginShield:
              Enabled: true
              OriginShieldRegion: us-east-1

        DefaultCacheBehavior:
          TargetOriginId: VercelOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          OriginRequestPolicyId: !Ref APIOriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true

        CacheBehaviors:
          # Photos: /api/planting/photo/* and direct S3 access
          - PathPattern: 'planting-photos/*'
            TargetOriginId: S3PhotosOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref PhotosCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ImageOptimizationFunction.FunctionMetadata.FunctionARN

          # Map tiles API
          - PathPattern: 'api/planting/map*'
            TargetOriginId: VercelOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref MapTilesCachePolicy
            OriginRequestPolicyId: !Ref APIOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

          # Next.js static assets (versioned, immutable)
          - PathPattern: '_next/static/*'
            TargetOriginId: VercelOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

          # Public static assets
          - PathPattern: 'assets/*'
            TargetOriginId: VercelOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

          - PathPattern: 'icons/*'
            TargetOriginId: VercelOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404
            ErrorCachingMinTTL: 60
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0

        Logging:
          Bucket: !GetAtt CDNLogsBucket.DomainName
          Prefix: !Sub 'cloudfront/${Environment}/'
          IncludeCookies: false

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFRONT FUNCTIONS (Edge compute)
  # ═══════════════════════════════════════════════════════════════════════════

  ImageOptimizationFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'stellar-image-optimization-${Environment}'
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          
          // Add default image format if not specified
          if (!request.querystring.format) {
            var accept = request.headers.accept ? request.headers.accept.value : '';
            if (accept.includes('image/avif')) {
              request.querystring.format = { value: 'avif' };
            } else if (accept.includes('image/webp')) {
              request.querystring.format = { value: 'webp' };
            }
          }
          
          // Normalize cache key
          var qs = request.querystring;
          var cacheKey = uri;
          if (qs.w) cacheKey += '?w=' + qs.w.value;
          if (qs.h) cacheKey += (cacheKey.includes('?') ? '&' : '?') + 'h=' + qs.h.value;
          if (qs.q) cacheKey += (cacheKey.includes('?') ? '&' : '?') + 'q=' + qs.q.value;
          if (qs.format) cacheKey += (cacheKey.includes('?') ? '&' : '?') + 'format=' + qs.format.value;
          
          request.uri = cacheKey.split('?')[0];
          
          return request;
        }
      FunctionConfig:
        Comment: 'Image optimization and cache key normalization'
        Runtime: cloudfront-js-1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # S3 BUCKET POLICY (Allow CloudFront OAC)
  # ═══════════════════════════════════════════════════════════════════════════

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3PhotosBucketName
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${S3PhotosBucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ═══════════════════════════════════════════════════════════════════════════
  # CDN LOGS BUCKET
  # ═══════════════════════════════════════════════════════════════════════════

  CDNLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'stellar-cdn-logs-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: !If [IsProduction, 90, 30]
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  CDNLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CDNLogsBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontLogs
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CDNLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DomainName'

  CDNUrl:
    Description: CDN URL
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-CdnUrl'

  PhotosCachePolicyId:
    Description: Photos Cache Policy ID
    Value: !Ref PhotosCachePolicy

  MapTilesCachePolicyId:
    Description: Map Tiles Cache Policy ID
    Value: !Ref MapTilesCachePolicy
