input {
  # TCP socket for JSON formatted logs from Node.js / Winston
  tcp {
    port => 50000
    codec => json_lines
    type => "application-log"
  }

  # Filebeat input for container / system logs
  beats {
    port => 5044
    type => "container-log"
  }
}

filter {
  if [type] == "application-log" {
    # Parse timestamp if available
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }

    # Normalize log level
    if [level] {
      mutate {
        lowercase => [ "level" ]
      }
    }

    # Ensure txId field exists for request correlation
    if ![txId] {
      mutate {
        add_field => { "txId" => "no-txid" }
      }
    }
  }

  # Redact sensitive credentials if unredacted string leaked
  mutate {
    gsub => [
      "message", "password=[^&\s]+", "password=[REDACTED]",
      "message", "secret=[^&\s]+", "secret=[REDACTED]",
      "message", "authorization:\s*Bearer\s+[^\s]+", "authorization: Bearer [REDACTED]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "harvesta-logs-%{+YYYY.MM.dd}"
  }
  
  # Also print to stdout for debugging container logs
  stdout {
    codec => rubydebug { metadata => false }
  }
}
