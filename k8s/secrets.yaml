##############################################################################
# Secret templates for Harvesta
#
# IMPORTANT: Never commit real values here.
# Options to populate:
#   1. Sealed Secrets (recommended):
#        kubeseal --format yaml < secret.plain.yaml > k8s/secrets.yaml
#   2. External Secrets Operator (AWS Secrets Manager, Vault, etc.)
#   3. CI/CD env substitution:
#        envsubst < k8s/secrets.yaml.tpl | kubectl apply -f -
#
# All values below must be base64-encoded:
#   echo -n "mysecret" | base64
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: harvesta-secrets
  namespace: harvesta
  labels:
    app.kubernetes.io/name: harvesta
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # DATABASE_URL: postgresql://user:pass@postgres:5432/harvesta
  DATABASE_URL: REPLACE_BASE64

  # SENDGRID_API_KEY
  SENDGRID_API_KEY: REPLACE_BASE64

  # SENDGRID_FROM_EMAIL
  SENDGRID_FROM_EMAIL: REPLACE_BASE64

  # REGION_HASH_SECRET: openssl rand -hex 32
  REGION_HASH_SECRET: REPLACE_BASE64

  # STRIPE_SECRET_KEY
  STRIPE_SECRET_KEY: REPLACE_BASE64

  # STRIPE_WEBHOOK_SECRET
  STRIPE_WEBHOOK_SECRET: REPLACE_BASE64

  # AWS S3 credentials (for planter photo uploads)
  AWS_ACCESS_KEY_ID: REPLACE_BASE64
  AWS_SECRET_ACCESS_KEY: REPLACE_BASE64
  AWS_REGION: REPLACE_BASE64
  AWS_S3_BUCKET: REPLACE_BASE64

  # Admin auth
  ADMIN_SECRET: REPLACE_BASE64

  # Contract IDs (Soroban)
  NEXT_PUBLIC_CONTRACT_TREE_ESCROW: REPLACE_BASE64
  NEXT_PUBLIC_CONTRACT_ESCROW_MILESTONE: REPLACE_BASE64
  NEXT_PUBLIC_CONTRACT_LOCATION_PROOF: REPLACE_BASE64
  NEXT_PUBLIC_CONTRACT_NULLIFIER_REGISTRY: REPLACE_BASE64
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: harvesta
  labels:
    app.kubernetes.io/name: harvesta
    app.kubernetes.io/component: postgres
type: Opaque
data:
  # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
  POSTGRES_DB: REPLACE_BASE64
  POSTGRES_USER: REPLACE_BASE64
  POSTGRES_PASSWORD: REPLACE_BASE64
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: harvesta
  labels:
    app.kubernetes.io/name: harvesta
    app.kubernetes.io/component: redis
type: Opaque
data:
  # REDIS_PASSWORD
  REDIS_PASSWORD: REPLACE_BASE64
