[package]
name = "endowment-stream"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils", "alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
panic = "abort"
codegen-units = 1
lto = true
